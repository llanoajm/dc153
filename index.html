<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Steinmetz Power Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: 36px;
  }

  .lockup img.mark {
    width: 260px;
    height: auto;
    display: block;
    filter: brightness(0);
  }

  .lockup .word {
    display: flex;
    flex-direction: column;
    line-height: 0.92;
    letter-spacing: -0.035em;
  }

  .lockup .word .l1 {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 80px;
    font-weight: 700;
    color: #000000;
  }

  .lockup .word .l2 {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 80px;
    font-weight: 700;
    color: rgba(0, 0, 0, 0.65);
  }
</style>
</head>
<body>
  <div class="lockup">
    <img class="mark" src="spi-mark.png" alt="SPI mark">
    <div class="word">
      <span class="l1">Steinmetz Power</span>
      <span class="l2">Infrastructure</span>
    </div>
  </div>
</body>
</html>
