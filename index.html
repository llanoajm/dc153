<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Steinmetz</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="spi-mark-filled.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Sora', system-ui, sans-serif;
    color: #000;
  }

  .lockup {
    --word-size: clamp(22px, 5.2vw, 44px);
    --mark-size: clamp(34px, 8vw, 68px);
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.9vw, 16px);
  }

  .mark {
    height: var(--mark-size);
    width: auto;
    display: block;
  }

  .word {
    font-size: var(--word-size);
    font-weight: 600;
    color: #000;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
  }

  .footer {
    position: fixed;
    bottom: clamp(20px, 4vh, 36px);
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(7px, 0.9vw, 10px);
    font-weight: 600;
    letter-spacing: 0.42em;
    padding: 0 0.42em 0 0;
    text-transform: uppercase;
    color: #000;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="lockup">
    <img class="mark" src="spi-mark-filled.png" alt="Steinmetz mark">
    <div class="word">Steinmetz</div>
  </div>
</body>
</html>
