<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Steinmetz Power Infrastructure</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="favicon.png">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  @font-face {
    font-family: 'Geograph';
    src: url('KlimTestFonts (1)/Test web fonts (Variable, WOFF2)/Test Geograph/test-geograph-vf-roman.woff2') format('woff2');
    font-weight: 100 900;
    font-style: normal;
  }

  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lockup {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .lockup img.mark {
    width: 100px;
    height: auto;
    display: block;
    filter: brightness(0);
  }

  .lockup .word {
    display: flex;
    flex-direction: column;
    line-height: 0.92;
    letter-spacing: -0.035em;
  }

  .lockup .word span {
    font-family: 'Geograph', system-ui, sans-serif;
    font-size: 40px;
    font-weight: 700;
    color: #000000;
  }
</style>
</head>
<body>
  <div class="lockup">
    <img class="mark" src="spi-mark.png" alt="SPI mark">
    <div class="word">
      <span>Steinmetz</span>
      <span>Power Infrastructure</span>
    </div>
  </div>
</body>
</html>
