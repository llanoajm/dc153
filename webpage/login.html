<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Steinmetz — Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" type="image/png" href="spi-mark-filled.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Sora', system-ui, sans-serif;
    color: #000;
  }

  .card {
    width: clamp(300px, 90vw, 380px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .lockup {
    --word-size: clamp(20px, 4.4vw, 36px);
    --mark-size: clamp(30px, 6.5vw, 54px);
    display: flex;
    align-items: center;
    gap: clamp(8px, 1.6vw, 13px);
  }

  .mark {
    height: var(--mark-size);
    width: auto;
    display: block;
  }

  .word {
    font-size: var(--word-size);
    font-weight: 600;
    color: #000;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
  }

  .form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-family: 'Sora', system-ui, sans-serif;
    font-size: 14px;
    font-weight: 400;
    color: #000;
    background: #fff;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus {
    border-color: #000;
  }

  input::placeholder {
    color: #bbb;
  }

  .btn {
    margin-top: 6px;
    width: 100%;
    padding: 13px;
    background: #000;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Sora', system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }

  .btn:hover { background: #222; }
  .btn:active { transform: scale(0.98); }

  .error {
    font-size: 12px;
    font-weight: 500;
    color: #c0392b;
    text-align: center;
    min-height: 16px;
    letter-spacing: 0.01em;
  }

  .footer {
    position: fixed;
    bottom: clamp(20px, 4vh, 36px);
    left: 0;
    right: 0;
    text-align: center;
    font-family: system-ui, -apple-system, sans-serif;
    font-size: clamp(12px, 1.2vw, 14px);
    font-weight: 400;
    letter-spacing: 0.01em;
    color: #aaa;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="lockup">
      <img class="mark" src="spi-mark-filled.png" alt="Steinmetz mark">
      <div class="word">Steinmetz</div>
    </div>

    <form class="form" id="loginForm" autocomplete="off" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" placeholder="Enter username" autocomplete="username" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" />
      </div>
      <div class="error" id="errorMsg"></div>
      <button class="btn" type="submit">Access Portal</button>
    </form>
  </div>

  <footer class="footer">Steinmetz Power Infrastructure &copy; 2026</footer>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;
      const err  = document.getElementById('errorMsg');

      if (user === 'admin' && pass === 'admin123') {
        sessionStorage.setItem('spi_auth', 'granted');
        window.location.replace('launch.html');
      } else {
        err.textContent = 'Incorrect username or password.';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });

    // Clear stale error on input
    ['username', 'password'].forEach(function(id) {
      document.getElementById(id).addEventListener('input', function() {
        document.getElementById('errorMsg').textContent = '';
      });
    });
  </script>
</body>
</html>
